version: '3.8'

services:
  # Aggregator Server (Go version)
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.go-agent
    command: ["serve", "--port", "8080"]
    ports:
      - "8080:8080"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider -q http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # CentOS 7 Agent (using pre-built binary)
  agent-centos7:
    image: centos:7
    volumes:
      - ./infra-auditor-linux-amd64:/usr/local/bin/infra-auditor:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - AGGREGATOR_URL=http://aggregator:8080
    command: |
      sh -c "
        # Fix CentOS 7 repos (EOL)
        sed -i 's|^mirrorlist=|#mirrorlist=|g' /etc/yum.repos.d/CentOS-*.repo &&
        sed -i 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo &&
        yum install -y procps-ng net-tools &&
        chmod +x /usr/local/bin/infra-auditor &&
        echo '===== CentOS 7 Test =====' &&
        /usr/local/bin/infra-auditor scan --role compute --output /tmp/report.json &&
        echo '===== Report generated =====' &&
        ls -la /tmp/report.json &&
        head -20 /tmp/report.json
      "
    depends_on:
      aggregator:
        condition: service_healthy
    networks:
      - test-net

  # Ubuntu 22.04 Agent
  agent-ubuntu22:
    image: ubuntu:22.04
    volumes:
      - ./infra-auditor-linux-amd64:/usr/local/bin/infra-auditor:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - AGGREGATOR_URL=http://aggregator:8080
    command: |
      sh -c "
        apt-get update &&
        apt-get install -y --no-install-recommends procps net-tools wget curl &&
        chmod +x /usr/local/bin/infra-auditor &&
        echo '===== Ubuntu 22.04 Test =====' &&
        /usr/local/bin/infra-auditor scan --role network --output /tmp/report.json &&
        echo '===== Report generated =====' &&
        ls -la /tmp/report.json &&
        head -20 /tmp/report.json
      "
    depends_on:
      aggregator:
        condition: service_healthy
    networks:
      - test-net

  # Ubuntu 24.04 Agent
  agent-ubuntu24:
    image: ubuntu:24.04
    volumes:
      - ./infra-auditor-linux-amd64:/usr/local/bin/infra-auditor:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - AGGREGATOR_URL=http://aggregator:8080
    command: |
      sh -c "
        apt-get update &&
        apt-get install -y --no-install-recommends procps net-tools wget curl &&
        chmod +x /usr/local/bin/infra-auditor &&
        echo '===== Ubuntu 24.04 Test =====' &&
        /usr/local/bin/infra-auditor scan --role storage --output /tmp/report.json &&
        echo '===== Report generated =====' &&
        ls -la /tmp/report.json &&
        head -20 /tmp/report.json
      "
    depends_on:
      aggregator:
        condition: service_healthy
    networks:
      - test-net

  # Rocky 9 Agent
  agent-rocky9:
    image: rockylinux:9
    volumes:
      - ./infra-auditor-linux-amd64:/usr/local/bin/infra-auditor:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - AGGREGATOR_URL=http://aggregator:8080
    command: |
      sh -c "
        dnf install -y procps-ng net-tools wget &&
        chmod +x /usr/local/bin/infra-auditor &&
        echo '===== Rocky 9 Test =====' &&
        /usr/local/bin/infra-auditor scan --role controller --output /tmp/report.json &&
        echo '===== Report generated =====' &&
        ls -la /tmp/report.json &&
        head -20 /tmp/report.json
      "
    depends_on:
      aggregator:
        condition: service_healthy
    networks:
      - test-net

  # Test HTTP communication
  test-client:
    image: alpine:3.19
    volumes:
      - ./infra-auditor-linux-amd64:/usr/local/bin/infra-auditor:ro
    environment:
      - AGGREGATOR_URL=http://aggregator:8080
    command: |
      sh -c "
        apk add --no-cache curl &&
        echo 'Waiting for aggregator...' &&
        sleep 15 &&
        echo '===== Testing aggregator health =====' &&
        curl -f http://aggregator:8080/api/health ||
        echo 'Health check failed' &&
        echo '===== Testing reports endpoint =====' &&
        curl -f http://aggregator:8080/api/reports ||
        echo 'Reports endpoint failed' &&
        echo '===== Alpine binary test =====' &&
        chmod +x /usr/local/bin/infra-auditor &&
        /usr/local/bin/infra-auditor version &&
        echo '===== Alpine scan test =====' &&
        /usr/local/bin/infra-auditor scan --role auto --output /tmp/alpine-report.json &&
        cat /tmp/alpine-report.json | head -10
      "
    depends_on:
      aggregator:
        condition: service_healthy
    networks:
      - test-net

networks:
  test-net:
    driver: bridge