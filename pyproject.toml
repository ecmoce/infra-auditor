[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-auditor"
version = "0.1.0"
description = "OS tuning audit agent for cloud infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "click>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
infra-auditor = "infra_auditor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["infra_auditor"]

[tool.coverage.report]
show_missing = true
fail_under = 80
