# infra-auditor Ansible 설정 파일

[defaults]
# 인벤토리 설정
inventory = inventory/production/
host_key_checking = False
timeout = 30

# SSH 설정
remote_user = ansible
private_key_file = ~/.ssh/infra-auditor-key
ansible_ssh_pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# 성능 설정
forks = 20
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400
stdout_callback = yaml

# 로깅
log_path = ansible.log
display_skipped_hosts = False
display_ok_hosts = True

# 재시도 설정
retry_files_enabled = True
retry_files_save_path = ./retry

# 콜백 플러그인
callback_whitelist = timer, profile_tasks

# 호스트 패턴
host_pattern_mismatch = warning

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[persistent_connection]
connect_timeout = 30
connect_retry_timeout = 15
command_timeout = 30

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey
pipelining = True
control_path_dir = /tmp/.ansible-cp
control_path = %(directory)s/%%h-%%p-%%r