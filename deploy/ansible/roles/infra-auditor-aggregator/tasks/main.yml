---
# infra-auditor-aggregator 배포 태스크

- name: 아키텍처 감지
  set_fact:
    system_arch: "{{ arch_map[ansible_architecture] | default('amd64') }}"

- name: OS 패밀리 감지
  set_fact:
    os_family: "{{ ansible_os_family }}"

- name: 필요 패키지 설치 (Red Hat 계열)
  yum:
    name: "{{ required_packages + aggregator_packages }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: 필요 패키지 설치 (Debian 계열)
  apt:
    name: "{{ required_packages + aggregator_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: 서비스 사용자 그룹 생성
  group:
    name: "{{ service_group }}"
    state: present

- name: 서비스 사용자 생성
  user:
    name: "{{ service_user }}"
    group: "{{ service_group }}"
    shell: /bin/false
    home: "{{ aggregator_data_path }}"
    system: yes
    state: present

- name: 디렉토리 생성
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0755'
  loop:
    - "{{ aggregator_data_path }}"
    - "{{ aggregator_log_path }}"
    - "{{ aggregator_config_path | dirname }}"

- name: 기존 바이너리 백업
  copy:
    src: "{{ aggregator_binary_path }}"
    dest: "{{ aggregator_binary_path }}.backup.{{ ansible_date_time.epoch }}"
    remote_src: yes
    backup: no
  ignore_errors: yes

- name: 바이너리 다운로드 URL 설정
  set_fact:
    binary_url: "{{ github_release_base_url }}/{{ aggregator_binary_name }}-linux-{{ system_arch }}"

- name: infra-auditor-aggregator 바이너리 다운로드
  get_url:
    url: "{{ binary_url }}"
    dest: "{{ aggregator_binary_path }}"
    mode: '0755'
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    timeout: "{{ download_timeout }}"
  notify: restart infra-auditor-aggregator

- name: 바이너리 실행 가능 확인
  command: "{{ aggregator_binary_path }} --version"
  register: version_check
  failed_when: version_check.rc != 0
  changed_when: false

- name: Aggregator 설정 파일 생성
  template:
    src: aggregator.yml.j2
    dest: "{{ aggregator_config_path }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0600'
  notify: restart infra-auditor-aggregator

- name: systemd 서비스 파일 생성
  template:
    src: infra-auditor-aggregator.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart infra-auditor-aggregator

- name: nginx 가용 사이트 설정
  template:
    src: nginx-aggregator.conf.j2
    dest: "{{ nginx_config_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx
  when: install_nginx | default(true)

- name: nginx 활성화 사이트 링크
  file:
    src: "{{ nginx_config_path }}"
    dest: "{{ nginx_config_enabled_path }}"
    state: link
  notify: restart nginx
  when: install_nginx | default(true)

- name: SSL 인증서 디렉토리 생성
  file:
    path: "{{ item | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ ssl_cert_path }}"
    - "{{ ssl_key_path }}"
  when: enable_ssl

- name: 데이터베이스 파일 초기화
  file:
    path: "{{ db_file }}"
    state: touch
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0600'
  when: db_type == 'sqlite'

- name: 백업 디렉토리 생성
  file:
    path: "{{ aggregator_data_path }}/backups"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0755'
  when: backup_enabled

- name: 백업 스크립트 생성
  template:
    src: backup-aggregator.sh.j2
    dest: /usr/local/bin/backup-aggregator.sh
    mode: '0755'
    owner: root
    group: root
  when: backup_enabled

- name: 백업 Cron 작업 추가
  cron:
    name: "infra-auditor aggregator backup"
    job: "/usr/local/bin/backup-aggregator.sh"
    cron_file: infra-auditor-aggregator
    user: "{{ service_user }}"
    minute: "{{ backup_schedule.split()[0] }}"
    hour: "{{ backup_schedule.split()[1] }}"
    day: "{{ backup_schedule.split()[2] }}"
    month: "{{ backup_schedule.split()[3] }}"
    weekday: "{{ backup_schedule.split()[4] }}"
  when: backup_enabled

- name: 로그 로테이션 설정
  blockinfile:
    path: /etc/logrotate.d/infra-auditor-aggregator
    create: yes
    owner: root
    group: root
    mode: '0644'
    block: |
      {{ aggregator_log_path }}/*.log {
          size {{ log_rotation_size }}
          rotate {{ log_retention_days }}
          compress
          delaycompress
          missingok
          notifempty
          sharedscripts
          postrotate
              systemctl reload {{ service_name }}
          endscript
      }

- name: 방화벽 포트 오픈 (firewalld)
  firewalld:
    port: "{{ aggregator_port }}/tcp"
    permanent: yes
    state: enabled
  notify: reload firewalld
  when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution_major_version'] | int >= 7
  ignore_errors: yes

- name: 방화벽 포트 오픈 (ufw)
  ufw:
    rule: allow
    port: "{{ aggregator_port }}"
    proto: tcp
  when: ansible_facts['os_family'] == "Debian"
  ignore_errors: yes

- name: systemd 데몬 reload
  systemd:
    daemon_reload: yes

- name: infra-auditor-aggregator 서비스 활성화 및 시작
  systemd:
    name: "{{ service_name }}"
    enabled: yes
    state: started

- name: nginx 서비스 활성화 및 시작
  systemd:
    name: nginx
    enabled: yes
    state: started
  when: install_nginx | default(true)

- name: 서비스 상태 확인
  systemd:
    name: "{{ service_name }}"
    state: started
  register: service_status
  failed_when: service_status.status.ActiveState != "active"

- name: 엔드포인트 헬스체크
  uri:
    url: "http://{{ aggregator_bind_address }}:{{ aggregator_port }}/health"
    method: GET
    status_code: 200
  retries: 5
  delay: 10
  delegate_to: localhost
  when: run_health_check | default(true)