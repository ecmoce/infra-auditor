---
# 미국 리전 인벤토리
all:
  children:
    control:
      hosts:
        ctrl-us-01:
          ansible_host: "{{ ctrl_us_01_ip | default('10.1.1.10') }}"
          role: control
        ctrl-us-02:
          ansible_host: "{{ ctrl_us_02_ip | default('10.1.1.11') }}"
          role: control
      vars:
        region: us-east
        
    compute:
      hosts:
        cmp-us-[01:50]:
          ansible_host: "10.1.2.{{ item }}"
          role: compute
      vars:
        region: us-east
        
    network:
      hosts:
        net-us-[01:10]:
          ansible_host: "10.1.3.{{ item }}"
          role: network
      vars:
        region: us-east
        
    storage_ceph:
      hosts:
        sto-us-[01:30]:
          ansible_host: "10.1.4.{{ item }}"
          role: storage-ceph
      vars:
        region: us-east
        
    storage_s3:
      hosts:
        s3-us-[01:10]:
          ansible_host: "10.1.5.{{ item }}"
          role: storage-s3
      vars:
        region: us-east
        
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: "{{ us_ssh_key | default('~/.ssh/us-servers') }}"
    aggregator_url: "{{ us_aggregator_url | default('https://aggregator-us.infra.company.com') }}"
    region_code: us
    timezone: America/New_York